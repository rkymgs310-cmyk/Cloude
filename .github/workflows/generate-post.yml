name: Generate daily post

on:
  schedule:
    # 毎日 21:00 JST (12:00 UTC) に実行
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate:post

      - name: Commit and push if there are changes
        run: |
          git config user.name "gadget-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/topics.json src/content/posts
          if git diff --cached --quiet; then
            echo "No new post generated."
          else
            git commit -m "chore: add auto-generated post"
            git push
          fi
